# CI for Helm. Gates merges on:
#   1. typecheck (back/src + data/generators under strict TS),
#   2. unit tests (vitest — policy reconciler, OCR reconciler, RNG),
#   3. measurement smoke run (10-invoice mock pipeline end-to-end).
#
# No deploy stage yet — the dashboard front-end hasn't landed. Once
# `front/` ships, add a `deploy` job that builds the SPA and pushes to
# Vercel (uses the global `vercel:deploy` pattern from the user's
# project skills).
#
# Concurrency: cancel an in-flight CI run when a newer commit lands on
# the same PR — Helm's tests are cheap (~30s wall-clock) and the
# saved minutes add up across iterations. `main` is exempt so deploys
# can't get cancelled by overlapping merges (when deploys exist).

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  test:
    name: typecheck · unit · smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Node dependency audit
        run: pnpm audit --audit-level high

      - name: Open-source license compliance scan
        run: pnpm exec license-checker --summary --production || npx license-checker --summary --production

      - name: Workspace lint
        run: pnpm --filter "./back" lint || true

      # Strict-TS typecheck covers back/src + data/generators + scripts.
      - name: Typecheck
        run: pnpm typecheck:data

      # Build workspace packages
      - name: Build
        run: pnpm build

      # Vitest: deterministic-RNG, payout-policy, OCR-reconciler suites.
      - name: Unit tests with coverage
        run: pnpm test:coverage

      # Quick end-to-end smoke against a deterministic seed=1 fixture.
      # Re-runs the synthetic-data generators to confirm they still
      # produce the committed labels.json, then exercises the OCR
      # pipeline against the mock extractor (no API budget spent).
      # The full --extractor=groq run is on-demand only; CI just
      # asserts the wiring works.
      - name: Generators reproduce fixture
        run: pnpm data:generate --seed 1

      - name: Install Chromium for PNG render
        run: pnpm exec playwright install --with-deps chromium

      - name: Render seed=1 PNGs
        run: pnpm data:render-png --seed 1

      - name: Mock OCR pipeline smoke (limit 10)
        run: pnpm measure:invoice-ocr --seed 1 --limit 10

  e2e:
    name: E2E (Playwright QA)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # E2E asserts the dashboard against the committed gemini report.json.
      # Self-starts the Vite dev server via webServer in playwright.config.ts.
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: [secrets, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
          VERCEL_DEPLOY_HOOK_PROD: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            if [ -z "$VERCEL_DEPLOY_HOOK_STAGING" ]; then
              echo "Notice: VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deploy."
              exit 0
            fi
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_STAGING"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -z "$VERCEL_DEPLOY_HOOK_PROD" ]; then
              echo "Error: VERCEL_DEPLOY_HOOK_PROD is required but not set."
              exit 1
            fi
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_PROD"
          fi

# Notes for evolving this:
#
# - When front/ lands: add a `build-front` job that runs `pnpm --filter
#   ./front build` after `test`, then a `deploy` job that pushes the
#   built artifact to Vercel via `vercel deploy --prod --token=...`.
# - When real-Groq measurements become part of the contract: do NOT
#   put a Groq run in CI by default — the daily token cap will get
#   exhausted in a busy week. Gate it behind workflow_dispatch with a
#   `confirm: groq-burn` input, or run it weekly via schedule.
# - When MCP servers ship: the typecheck step should expand to cover
#   mcp/* via `pnpm typecheck` (the recursive workspace variant).
